<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="src/footer.css">
    <link rel="stylesheet" href="src/navbar.css">
    <link rel="stylesheet" href="src/styles.css">
    <title>Cadastro - Papel & Poesia</title>
</head>

<body>
    <header>
        <nav id="navbar">
            <p id="nav_logo"> Papel <i>&</i> poesia</p>
            <ul id="nav_list">
                <li class="nav-item">
                    <a href="index.html">Início</a>
                </li>
                <li class="nav-item">
                    <a href="produtos.html">Produtos</a>
                </li>
                <li class="nav-item">
                    <a href="login.html">Cadastro</a>
                </li>
                <li class="nav-item">
                    <a href="contatos.html">Contatos</a>
                </li>
                <li class="nav-item">
                    <a href="sobre.html">Sobre nós</a>
                </li>



            </ul>
        </nav>
    </header>
    <main id="conteudo">
        <section id="cadastro">
            <h1>Cadastro</h1>
            <form id="formCadastro" action="#" method="post">
                <div class="form-row">
                    <label for="inNome">Nome:</label>
                    <input type="text" id="inNome" name="nome" placeholder="Digite seu nome..." required
                        oninvalid="this.setCustomValidity('Digite seu nome')" oninput="this.setCustomValidity('')">
                </div>

                <div class="form-row">
                    <label for="inSenha">Senha:</label>
                    <input type="password" name="senha" id="inSenha" required minlength="6" maxlength="12"
                        oninvalid="this.setCustomValidity('Digite sua senha entre 6 e 12 caracteres')"
                        oninput="this.setCustomValidity('')" placeholder="Crie sua senha...">
                </div>

                <div class="form-row">
                    <label for="inMail">Email:</label>
                    <input type="email" name="email" id="inMail" required
                        oninvalid="this.setCustomValidity('Digite seu email corretamente')"
                        oninput="this.setCustomValidity('')" placeholder="Digite seu email...">
                </div>

                <div class="form-row">
                    <label for="inData">Data de nascimento:</label>
                    <input type="date" name="nascimento" id="inData" required
                        oninvalid="this.setCustomValidity('Insira sua data de nascimento')"
                        oninput="this.setCustomValidity('')">
                </div>

                <div class="form-row">
                    <label for="slCidades">Selecione sua cidade:</label>
                    <select id="slCidades" required oninvalid="this.setCustomValidity('Selecione sua cidade')"
                        oninput="this.setCustomValidity('')">
                        <option value="1">Vitória</option>
                        <option value="2">Serra</option>
                        <option value="3">Vila Velha</option>
                    </select>
                </div>

                <div class="form-row">
                    <label>Selecione seu gênero:</label>
                    <div class="choice-group">
                        <label class="choice-label"><input type="radio" name="sexo" value="M" required>
                            Masculino</label>
                        <label class="choice-label"><input type="radio" name="sexo" value="F" required> Feminino</label>
                    </div>
                </div>

                <div class="form-row">
                    <label>Interesses:</label>
                    <div class="choice-group choice-group--wrap">
                        <label class="choice-label"><input type="checkbox" name="interesse" value="Cadernos">
                            Cadernos</label>
                        <label class="choice-label"><input type="checkbox" name="interesse" value="Agendas">
                            Agendas</label>
                        <label class="choice-label"><input type="checkbox" name="interesse" value="Canetas/Lapis">
                            Canetas/lápis</label>
                        <label class="choice-label"><input type="checkbox" name="interesse" value="Gráfica">
                            Gráfica</label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="txtMensagem">Mensagem:</label>
                    <textarea id="txtMensagem" name="mensagem" rows="5"
                        placeholder="Deixe uma mensagem para nossa equipe!"></textarea>
                </div>

                <div class="form-row form-actions">
                    <div></div>
                    <input type="submit" name="enviar" value="Enviar">
                </div>
            </form>
        </section>

    </main>

    <footer>
        <div id="rodape-conteudo">
            <p>&copy; 2026 Papel & Poesia. Todos os direitos reservados.</p>
            <p>Desenvolvido por Brian L. :D</p>

        </div>

    </footer>
</body>

</html>
